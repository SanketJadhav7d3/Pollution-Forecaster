[project]
name = "delhi-mumbai-aqi-mlops"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy>=2.5.2",
    "pandas>=2.2,<3",
    "pyarrow>=25.0.1",
    "python-dotenv>=1.2.3",
    "pyyaml>=6.0.3",
    "requests>=2.34.2",
]

[dependency-groups]
dev = [
    "matplotlib>=3.11.1",
    "mlflow>=3.0",
    "pytest>=9.1.1",
    "ruff>=0.16.4",
    "scikit-learn>=1.9.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
